---
# yamllint disable rule:comments rule:line-length rule:truthy
name: CI

on:
  push:
  pull_request:

# Least privilege by default; no job needs more than reading the checkout.
permissions:
  contents: read

jobs:
  # (a) The pure module tests must pass with nothing but pytest installed —
  # this is what a contributor with no extra setup, and any future
  # dependency-free environment, actually runs.
  test-pure:
    name: Tests (pytest only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Run tests with only pytest installed
        run: uv run --no-project --python 3.13 --with pytest -- python -m pytest -q tests

  # (b) The full suite, with the runtime dependencies and a real broker
  # available, so tests covering aiohttp/aiomqtt integration (present or
  # future) actually exercise them instead of skipping via importorskip.
  test-full:
    name: Tests (full dependencies + mosquitto)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto

      - name: Run tests with pytest + requirements.txt installed
        run: |
          uv run --no-project --python 3.13 --with pytest --with-requirements zafro_bridge/requirements.txt \
            -- python -m pytest -q tests

  # (c) Catches syntax errors the tests wouldn't (e.g. a module only imported
  # at add-on runtime), the same check the release checklist runs by hand.
  compile:
    name: Byte-compile package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Byte-compile the bridge package
        run: python3 -m py_compile zafro_bridge/rootfs/usr/src/zafro_bridge/*.py

  # (d) Lint with the checked-in pyproject.toml configuration.
  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Run ruff check
        run: uv run --no-project --with ruff -- ruff check .

  # (e) Home Assistant's own add-on manifest/schema linter.
  addon-lint:
    name: Home Assistant add-on linter
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./zafro_bridge"

  # (f) Confirm the add-on image still builds for both architectures Home
  # Assistant will build it for. This repo ships no `image:` key in
  # config.yaml, so the Supervisor builds the add-on locally on the HA host
  # from this Dockerfile rather than pulling a pre-built, registry-hosted
  # image — there is no image to push here, only a build to validate.
  #
  # This intentionally does NOT use the `home-assistant/builder` action:
  # that action is deprecated (see
  # https://developers.home-assistant.io/blog/2026/04/02/builder-migration/)
  # and its replacement (home-assistant/builder's new composable actions)
  # is built around publishing signed, multi-arch images to a container
  # registry — machinery this locally-built add-on doesn't use and
  # shouldn't grow just to run a test build. Plain buildx + QEMU emulation
  # is the direct way to validate a multi-arch Dockerfile builds without
  # publishing anything.
  docker-build:
    name: Docker test build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ${{ matrix.arch }} image (not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./zafro_bridge
          platforms: ${{ matrix.platform }}
          push: false
          tags: zafro_bridge:test-${{ matrix.arch }}
